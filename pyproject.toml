[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mtaffiliate-platform"
version = "0.1.0"
description = "Document-driven affiliate intelligence and automation platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
mtaffiliate-all-api = "mtaffiliate.interfaces.cli.run_api:main_all"
mtaffiliate-program1-api = "mtaffiliate.interfaces.cli.run_api:main_program1"
mtaffiliate-program2-api = "mtaffiliate.interfaces.cli.run_api:main_program2"
mtaffiliate-program3-api = "mtaffiliate.interfaces.cli.run_api:main_program3"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "hypothesis>=6.112,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<8",
  "pytest-timeout>=2.3,<3",
  "playwright>=1.46,<2",
  "ruff>=0.6,<1",
  "websocket-client>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtaffiliate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "stress: high-volume or load-oriented tests",
  "integration: real adapter/database integration tests",
]

[tool.coverage.run]
branch = true
source = ["mtaffiliate"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
