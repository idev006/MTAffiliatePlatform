name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backoffice-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python tools/program1_verify.py --stage static
      - name: Core and contract tests with branch coverage
        run: python tools/program1_verify.py --stage core
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-backoffice-core
          path: runtime/verification/
          if-no-files-found: warn

  backoffice-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: SQLite repository, bootstrap and Alembic integration with branch coverage
        run: python tools/program1_verify.py --stage sqlite
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-backoffice-sqlite
          path: runtime/verification/
          if-no-files-found: warn

  backoffice-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Stress suite
        run: python tools/program1_verify.py --stage stress
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-backoffice-stress
          path: runtime/verification/
          if-no-files-found: warn

  program1-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser_plugin/program1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser_plugin/program1/package-lock.json
      - name: Install
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extension build and suites
        run: python ../../tools/program1_verify.py --stage extension
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-program1-extension
          path: runtime/verification/
          if-no-files-found: warn

  program1-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser_plugin/program1/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Build Program 1 extension
        working-directory: browser_plugin/program1
        run: |
          npm ci
          npm run build
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Real Chromium MV3 restart/reconcile E2E
        run: xvfb-run -a python tools/program1_verify.py --stage browser
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-program1-browser-e2e
          path: runtime/verification/
          if-no-files-found: warn
