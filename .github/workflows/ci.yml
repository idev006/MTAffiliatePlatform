name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backoffice-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests migrations
      - name: Core and contract tests with branch coverage
        run: >-
          pytest -m 'not stress and not integration'
          --cov=mtaffiliate.domain.product
          --cov=mtaffiliate.domain.program1
          --cov=mtaffiliate.domain.job
          --cov=mtaffiliate.domain.affiliate_offer
          --cov=mtaffiliate.domain.publishing
          --cov=mtaffiliate.domain.scene
          --cov=mtaffiliate.domain.device
          --cov=mtaffiliate.domain.worker_registry
          --cov=mtaffiliate.engines.product_intelligence_engine
          --cov=mtaffiliate.engines.affiliate_offer_engine
          --cov=mtaffiliate.engines.publishing_guard_engine
          --cov=mtaffiliate.engines.scene_engine
          --cov=mtaffiliate.engines.device_host_engine
          --cov=mtaffiliate.application.program1
          --cov=mtaffiliate.application.program1_strategy
          --cov=mtaffiliate.application.program1_jobs
          --cov=mtaffiliate.engines.shared_job_engine
          --cov=mtaffiliate.adapters.persistence.inmemory.job
          --cov=mtaffiliate.application.program2
          --cov=mtaffiliate.application.program3
          --cov=mtaffiliate.application.program3_worker
          --cov=mtaffiliate.application.program3_workflow
          --cov=mtaffiliate.application.worker_registry
          --cov=mtaffiliate.bootstrap.config
          --cov=mtaffiliate.bootstrap.paths
          --cov=mtaffiliate.adapters.persistence.inmemory
          --cov=mtaffiliate.adapters.workers
          --cov=mtaffiliate.adapters.android
          --cov=mtaffiliate.adapters.affiliate_export
          --cov=mtaffiliate.interfaces.api
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

  backoffice-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: SQLite repository, bootstrap and Alembic integration with branch coverage
        run: >-
          pytest -m integration tests/integration/sqlite --timeout=60
          --cov=mtaffiliate.adapters.persistence.sqlalchemy
          --cov=mtaffiliate.bootstrap.migrations
          --cov=mtaffiliate.bootstrap.program1
          --cov=mtaffiliate.bootstrap.program2_program3
          --cov=mtaffiliate.bootstrap.worker_registry
          --cov=mtaffiliate.bootstrap.shared_job
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

  backoffice-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Stress suite
        run: pytest -m stress --timeout=60

  program1-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser_plugin/program1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser_plugin/program1/package-lock.json
      - name: Install
        run: npm ci
      - name: Build Vue side panel
        run: npm run build
      - name: Extension suites
        run: npm test
