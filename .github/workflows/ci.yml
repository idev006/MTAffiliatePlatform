name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backoffice-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests migrations
      - name: Core and contract tests with branch coverage
        run: >-
          pytest -m 'not stress and not integration'
          --cov=mtaffiliate.domain.product
          --cov=mtaffiliate.engines.product_intelligence_engine
          --cov=mtaffiliate.application.program1
          --cov=mtaffiliate.bootstrap
          --cov=mtaffiliate.adapters.persistence.inmemory
          --cov=mtaffiliate.interfaces.api
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

  backoffice-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: SQLite repository and Alembic integration
        run: pytest -m integration tests/integration/sqlite --timeout=60

  backoffice-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Stress suite
        run: pytest -m stress --timeout=60
